
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Joey Hung's Website{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('favorite_course', subject='BMGT', course_number='407') }}">
                Joey Hung
            </a>

            <div>
                <a class="text-white me-3" href="{{ url_for('favorite_course', subject='BMGT', course_number='407') }}">
                    Favorite Course
                </a>

                <a class="text-white" href="{{ url_for('contact') }}">
                    Contact
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-5">
        <div class="card shadow-sm p-4">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-muted mt-5 mb-4">
        <p>Created by Joey Hung</p>
    </footer>

</body>
</html>
