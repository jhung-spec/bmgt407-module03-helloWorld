
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block page_title %}
            {% block title %}Joey Hung's Website{% endblock %}
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('student_view_all') }}">
                Joey Hung
            </a>

            <div class="d-flex flex-wrap gap-3">
                <a class="text-white" href="{{ url_for('student_view_all') }}">
                    View All Students
                </a>

                <a class="text-white" href="{{ url_for('student_create') }}">
                    Add New Student
                </a>

                <a class="text-white" href="{{ url_for('favorite_course', subject='BMGT', course_number='407') }}">
                    Favorite Course
                </a>

                <a class="text-white" href="{{ url_for('contact') }}">
                    Contact
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-5 mb-5">
        <div class="card shadow-sm p-4">

            {% block content %}{% endblock %}

            {% if self.page_head()|trim %}
                <h1 class="h3 mb-4">{% block page_head %}{% endblock %}</h1>
            {% endif %}

            {% block page_content %}{% endblock %}

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-muted mt-5 mb-4">
        <p>Created by Joey Hung</p>
    </footer>

</body>
</html>
